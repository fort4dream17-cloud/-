name: Update Kiwoom investor flows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/update-kiwoom.yml", "scripts/kiwoom_flow.py"]
  workflow_run:
    workflows: ['Update index universe and flow']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: kiwoom-flow-update
  cancel-in-progress: false
jobs:
  collect:
    runs-on: [self-hosted, Windows, kiwoom]
    defaults:
      run:
        shell: cmd
    env:
      PYTHONUTF8: "1"
    timeout-minutes: 25
    steps:
      - name: Prepare portable Git without changing PC settings
        shell: python
        run: |
          import os,pathlib,shutil,urllib.request,zipfile,hashlib
          if not shutil.which('git'):
              root=pathlib.Path(os.environ['RUNNER_TEMP'])/'kiwoom-mingit'
              root.mkdir(exist_ok=True)
              archive=root/'mingit.zip'
              urllib.request.urlretrieve('https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.4/MinGit-2.56.0.4-64-bit.zip',archive)
              if hashlib.sha256(archive.read_bytes()).hexdigest()!='e3bf78351fe777fba47ddee5950082f8a98bb0f02604fdc7ba3ee2cb68ffa877':
                  raise SystemExit('Git download checksum mismatch')
              with zipfile.ZipFile(archive) as z:z.extractall(root)
              with open(os.environ['GITHUB_PATH'],'a',encoding='utf-8') as f:f.write(str(root/'cmd')+'\n')
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Use runner-bundled Node for data validation
        shell: python
        run: |
          import os,pathlib,shutil
          if not shutil.which('node'):
              root=pathlib.Path(os.environ['RUNNER_TEMP']).parents[1]
              candidates=[root/'externals'/version/'bin'/'node.exe' for version in ['node24','node20']]
              node=next((p for p in candidates if p.is_file()),None)
              if node is None:raise SystemExit('Runner-bundled Node missing')
              with open(os.environ['GITHUB_PATH'],'a',encoding='utf-8') as f:f.write(str(node.parent)+'\n')
      - name: Install job-local timezone data
        run: python -m pip install --disable-pip-version-check --target "%RUNNER_TEMP%\\kiwoom-python-deps" tzdata
      - name: Collect from registered-IP runner only
        id: api
        continue-on-error: true
        env:
          KIWOOM_FLOW_CACHE: ${{ runner.workspace }}/../kiwoom-flow-cache
          PYTHONPATH: ${{ runner.temp }}/kiwoom-python-deps
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/kiwoom_flow.py
      - name: Publish validated flows or failure status
        if: always() && steps.api.outcome != 'skipped'
        shell: python
        run: |
          import subprocess
          def git(*args):
              return subprocess.run(['git',*args],check=True)
          git('config','user.name','flow-data-bot')
          git('config','user.email','flow-data-bot@users.noreply.github.com')
          git('add','dist/data/index-market.json','dist/data/market.json','dist/data/index-status.json','dist/data/status.json','dist/data/kiwoom-status.json')
          changed=subprocess.run(['git','diff','--cached','--quiet']).returncode
          if changed==1:
              git('commit','-m','Refresh validated Kiwoom investor flows')
              git('pull','--rebase','origin','main')
              git('push','origin','HEAD:main')
          elif changed!=0:
              raise SystemExit(changed)
      - if: steps.api.outcome == 'failure'
        run: exit /b 1
