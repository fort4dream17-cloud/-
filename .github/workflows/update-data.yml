name: Collect approved market data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'scripts/check-freshness.py'
      - 'tests/test_freshness.py'
      - 'tests/test_collect.py'
      - '.github/workflows/update-data.yml'
  workflow_dispatch:
  schedule:
    - cron: '20 9,10,11 * * 1-5' # 18:20 Asia/Seoul. Schedule timing can be delayed by GitHub.
permissions:
  contents: write
concurrency:
  group: flow-data-update
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r scripts/requirements.txt
      - name: Check latest KRX session and existing data
        id: freshness
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FLOW_DATA_USE_CONFIRMED: ${{ vars.FLOW_DATA_USE_CONFIRMED }}
        run: python scripts/check-freshness.py --scope legacy --plan
      - name: Test calculations
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Collect and validate
        id: collect
        if: steps.freshness.outputs.needed != 'false'
        continue-on-error: true
        env:
          FLOW_DATASET_URL: ${{ secrets.FLOW_DATASET_URL }}
          FLOW_DATASET_TOKEN: ${{ secrets.FLOW_DATASET_TOKEN }}
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FLOW_DATA_USE_CONFIRMED: ${{ vars.FLOW_DATA_USE_CONFIRMED }}
          FLOW_PROVIDER: ${{ vars.FLOW_PROVIDER }}
        run: python scripts/collect.py --provider "${FLOW_PROVIDER:-https}"
      - name: Verify freshness and write recovery status
        id: verification
        if: always()
        continue-on-error: true
        run: python scripts/check-freshness.py --scope legacy --verify
      - name: Publish data and collection status
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data/market.json dist/data/status.json
          if [ -f dist/data/legacy-update-monitor.json ]; then git add dist/data/legacy-update-monitor.json; fi
          if [ -d logs ]; then git add logs; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update validated market data and collection status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Preserve failure status
        if: steps.collect.outcome == 'failure' || steps.verification.outcome == 'failure'
        run: exit 1
