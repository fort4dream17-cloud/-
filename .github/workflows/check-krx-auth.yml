name: Verify KRX authentication once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/check-krx-auth.yml']
permissions:
  contents: write
concurrency:
  group: krx-auth-recovery
  cancel-in-progress: false
  queue: max
jobs:
  authenticate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -r scripts/requirements.txt
      - name: Verify stored credentials once
        id: authenticate
        continue-on-error: true
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
          FLOW_DATA_USE_CONFIRMED: ${{ vars.FLOW_DATA_USE_CONFIRMED }}
          KRX_AUTH_RECOVERY: 'true'
        run: python scripts/check-krx-auth.py
      - name: Save authentication state without credentials
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data/krx-auth.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record KRX authentication gate status'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.authenticate.outcome == 'failure'
        run: exit 1
