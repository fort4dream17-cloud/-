name: Update index universe and flow
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['scripts/kiwoom_flow.py', 'tests/test_kiwoom.py', 'scripts/krx_openapi.py', 'scripts/collect-openapi.py', 'scripts/collect.py', 'tests/test_openapi.py', '.github/workflows/update-index-universe.yml']
  schedule:
    - cron: '35 9,10,11 * * 1-5'
permissions:
  contents: write
concurrency:
  group: flow-data-update
  cancel-in-progress: false
  queue: max
jobs:
  openapi:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate calculations and no-login policy
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Refresh through AUTH_KEY only
        id: api
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/collect-openapi.py
      - name: Publish API results before independent disclosure refresh
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh OpenAPI quotes and availability without web login'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Refresh independent OpenDART disclosures
        id: dart
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY }}
        run: python scripts/update-pension-disclosures.py
      - name: Publish observed API data and separate availability states
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh OpenAPI quotes and availability without web login'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.api.outcome == 'failure'
        run: exit 1


