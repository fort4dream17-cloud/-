name: Refresh pension disclosures independently
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Update index universe and flow']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: pension-disclosure-update
  cancel-in-progress: false
jobs:
  disclosures:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Refresh official pension disclosures
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY || secrets.OPENDART_API_KEY || secrets.OPEN_DART_API_KEY }}
        run: python scripts/update-pension-disclosures.py
      - name: Publish only disclosure files
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data/pension-holdings.json dist/data/disclosure-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh independent official pension disclosures'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
