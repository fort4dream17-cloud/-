name: Verify KRX OpenAPI
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['.github/workflows/check-krx-openapi.yml']
permissions:
  contents: write
concurrency:
  group: flow-data-update
  cancel-in-progress: false
  queue: max
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Verify actual AUTH_KEY services without login fallback
        id: api
        continue-on-error: true
        env:
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KRX_OPEN_API_KEY: ${{ secrets.KRX_OPEN_API_KEY }}
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
        run: python scripts/collect-openapi.py --probe
      - name: Publish key-safe service results
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data/krx-*.json
          if ! git diff --cached --quiet; then
            git commit -m 'Verify approved OpenAPI services without web authentication'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.api.outcome == 'failure'
        run: exit 1


