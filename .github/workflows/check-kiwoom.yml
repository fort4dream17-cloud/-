name: Verify Kiwoom REST connection
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/check-kiwoom.yml"]
permissions:
  contents: write
concurrency:
  group: kiwoom-flow-update
  cancel-in-progress: false
jobs:
  verify:
    # Explicit checks may use a configured fixed-IP runner.
    runs-on: [self-hosted, Windows, kiwoom]
    timeout-minutes: 3
    steps:
      - name: Confirm registered PC accepted the job
        shell: powershell
        run: echo "PC runner connected"
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Check token once without web login
        id: api
        continue-on-error: true
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_SECRET_KEY: ${{ secrets.KIWOOM_SECRET_KEY }}
        run: python scripts/check-kiwoom.py
      - name: Publish sanitized connection status
        if: always()
        shell: python
        run: |
          import subprocess
          def git(*args):
              return subprocess.run(['git',*args],check=True)
          git('config','user.name','flow-data-bot')
          git('config','user.email','flow-data-bot@users.noreply.github.com')
          git('add','dist/data/kiwoom-connection.json')
          changed=subprocess.run(['git','diff','--cached','--quiet']).returncode
          if changed==1:
              git('commit','-m','Record sanitized Kiwoom REST connection result')
              git('pull','--rebase','origin','main')
              git('push','origin','HEAD:main')
          elif changed!=0:
              raise SystemExit(changed)
      - if: steps.api.outcome == 'failure'
        run: exit 1
