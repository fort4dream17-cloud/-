name: Update ETF market and issuer holdings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-etf-monitor.py', 'scripts/collect-etf-holdings.py', '.github/workflows/update-etf-monitor.yml']
  workflow_run:
    workflows: ['Update index universe and flow']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: etf-market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build observed ETF market statistics independently of the PC
        run: python scripts/build-etf-monitor.py
      - name: Collect KODEX public domestic-equity PDFs without login
        id: holdings
        continue-on-error: true
        run: python scripts/collect-etf-holdings.py
      - name: Publish ETF metrics and explicit holdings availability
        if: always()
        run: |
          git config user.name 'flow-data-bot'
          git config user.email 'flow-data-bot@users.noreply.github.com'
          git add dist/data/etf-monitor.json dist/data/etf-holdings.json dist/data/etf-holdings-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh independent ETF metrics and issuer coverage'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - if: steps.holdings.outcome == 'failure'
        run: exit 1
