name: Update ETF market and issuer holdings
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/build-etf-monitor.py', 'scripts/collect-etf-holdings.py', '.github/workflows/update-etf-monitor.yml']
  workflow_run:
    workflows: ['Update Kiwoom investor flows']
    types: [completed]
permissions:
  contents: write
concurrency:
  group: etf-market-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: [self-hosted, Windows, kiwoom]
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Prepare portable Git without changing PC settings
        shell: python
        run: |
          import os,pathlib,shutil,urllib.request,zipfile,hashlib
          if not shutil.which('git'):
              root=pathlib.Path(os.environ['RUNNER_TEMP'])/'kiwoom-mingit'
              root.mkdir(exist_ok=True)
              archive=root/'mingit.zip'
              urllib.request.urlretrieve('https://github.com/git-for-windows/git/releases/download/v2.56.0.windows.4/MinGit-2.56.0.4-64-bit.zip',archive)
              if hashlib.sha256(archive.read_bytes()).hexdigest()!='e3bf78351fe777fba47ddee5950082f8a98bb0f02604fdc7ba3ee2cb68ffa877':
                  raise SystemExit('Git download checksum mismatch')
              with zipfile.ZipFile(archive) as z:z.extractall(root)
              with open(os.environ['GITHUB_PATH'],'a',encoding='utf-8') as f:f.write(str(root/'cmd')+'\n')
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - name: Build observed ETF market statistics
        run: python scripts/build-etf-monitor.py
      - name: Collect KODEX public domestic-equity PDFs without login
        id: holdings
        continue-on-error: true
        run: python scripts/collect-etf-holdings.py
      - name: Publish ETF market and explicitly limited holdings coverage
        if: always()
        shell: python
        run: |
          import subprocess,pathlib
          def git(*args):return subprocess.run(['git',*args],check=True)
          git('config','user.name','flow-data-bot')
          git('config','user.email','flow-data-bot@users.noreply.github.com')
          paths=[str(p) for p in map(pathlib.Path,['dist/data/etf-monitor.json','dist/data/etf-holdings.json','dist/data/etf-holdings-status.json']) if p.exists()]
          if paths:
              git('add',*paths)
              changed=subprocess.run(['git','diff','--cached','--quiet']).returncode
              if changed==1:
                  git('commit','-m','Refresh ETF quotes and disclosed issuer holdings')
                  git('pull','--rebase','origin','main')
                  git('push','origin','HEAD:main')
              elif changed!=0:raise SystemExit(changed)
      - if: steps.holdings.outcome == 'failure'
        run: exit /b 1
