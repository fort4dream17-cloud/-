name: Compact flow assets for deployment
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/flow_storage.py', '.github/workflows/compact-flow-assets.yml']
permissions:
  contents: write
concurrency:
  group: compact-flow-assets
  cancel-in-progress: false
jobs:
  compact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: main, fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: python scripts/flow_storage.py
      - run: |
          node scripts/validate.mjs dist/data/index-market.json
          node scripts/validate.mjs dist/data/market.json
          npm test
      - name: Publish lossless compact flow assets
        run: |
          git config user.name flow-data-bot
          git config user.email flow-data-bot@users.noreply.github.com
          git add dist/data/index-market.json dist/data/market.json
          if ! git diff --cached --quiet; then
            git commit -m 'Compact complete YTD flow history for static deployment'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
